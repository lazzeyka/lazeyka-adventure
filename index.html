<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приключения Лазейки</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="game-wrapper">
    <header class="game-header header-hidden" id="gameHeader">
      <h1 class="game-title">Приключения Лазейки</h1>
    </header>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>

      <!-- Экран загрузки ресурсов -->
      <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-title">Загрузка...</div>
        <div class="progress-bar-container">
          <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
        <div id="progressText" class="progress-text">0%</div>
      </div>
    </div>

    <footer class="game-footer">
      <!-- Аудио-контроллер (громкость и Mute) -->
      <div class="audio-controls badge" id="audioControls">
        <button id="muteBtn" class="audio-btn" type="button" title="Вкл/Выкл музыку (Клавиша M)" aria-label="Музыка">
          <span id="muteIcon" class="audio-icon">🔇</span>
        </button>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="50" step="1"
          title="Громкость музыки ([ / ])">
        <span id="volumeValue" class="volume-text">50%</span>
      </div>
    </footer>
  </main>

  <script type="module" src="src/main.js"></script>
</body>

</html>
